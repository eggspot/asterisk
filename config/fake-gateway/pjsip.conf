[global]
type = global
user_agent = Fake gateway
endpoint_identifier_order = username,ip

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
method = tlsv1_2
verify_server = no

[server]
type = endpoint
transport = transport-tls
context = fake-customer
disallow = all
allow = alaw
media_encryption = sdes
rtp_symmetric = yes
force_rport = yes
direct_media = no
rtp_keepalive = 1
aors = server
outbound_auth = port-1
callerid = "Customer" <${CALLBACK_NUMBER}>
${INBOUND_AUTH}

[server]
type = aor
contact = sip:${TARGET_HOST}:${TARGET_PORT};transport=tls

[server]
type = identify
endpoint = server
match = 0.0.0.0/0
