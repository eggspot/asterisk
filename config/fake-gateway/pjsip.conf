[global]
type = global
user_agent = Fake gateway
endpoint_identifier_order = ip

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
method = tlsv1_2
verify_server = no

[server]
type = endpoint
transport = transport-tls
context = fake-customer
disallow = all
allow = alaw
media_encryption = sdes
rtp_symmetric = yes
force_rport = yes
direct_media = no

[server]
type = identify
endpoint = server
match = 0.0.0.0/0
