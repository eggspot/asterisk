[system]
type = system
disable_tcp_switch = yes

[global]
type = global
user_agent = PBX
endpoint_identifier_order = username,auth_username
keep_alive_interval = 30

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:${SIP_TLS_PORT}
cert_file = ${TLS_CERT_FILE}
priv_key_file = ${TLS_KEY_FILE}
method = tlsv1_2
tos = cs3

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0
