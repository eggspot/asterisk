[general]
static = yes
writeprotect = yes

[callcenter-agents]
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)
exten => i,1,Hangup(21)

[callcenter-from-gateway]
exten => _X.,1,Goto(callcenter-inbound,s,1)
exten => _+X.,1,Goto(callcenter-inbound,s,1)
exten => s,1,Goto(callcenter-inbound,s,1)
exten => i,1,Hangup(21)

[callcenter-inbound]
exten => s,1,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=4)
 same => n,Set(CURLOPT(httpheader)=X-CallCenter-Token: ${ROUTE_TOKEN})
 same => n,Set(ROUTE=${CURL(${ROUTE_URL},trunk=${URIENCODE(${CHANNEL(endpoint)})}&caller=${URIENCODE(${CALLERID(num)})}&channel=${URIENCODE(${CHANNEL(uniqueid)})})})
 same => n,GotoIf($["${CUT(ROUTE,|,1)}" = "ring"]?ring)
 same => n,Ringing()
 same => n,Wait(20)
 same => n,Hangup(19)
 same => n(ring),Set(CALLCENTER_CALL=${CUT(ROUTE,|,2)})
 same => n,Set(CHANNEL(hangup_handler_push)=callcenter-ended,s,1)
 same => n,Set(CALLERID(all)="${CUT(ROUTE,|,5)}" <callcenter>)
 same => n,Dial(PJSIP/${CUT(ROUTE,|,3)},30,b(callcenter-inbound-headers^s^1(${CUT(ROUTE,|,4)}))U(callcenter-agent-answered^s^1^${CALLCENTER_CALL}))
 same => n,Hangup(19)

[callcenter-inbound-headers]
exten => s,1,Set(PJSIP_HEADER(add,X-CallCenter-Call)=${ARG1})
 same => n,Set(PJSIP_HEADER(add,X-CallCenter-Direction)=inbound)
 same => n,Return()

[callcenter-agent-answered]
exten => s,1,UserEvent(CallCenter,call: ${ARG1},step: AgentAnswered)
 same => n,Return()

[callcenter-outbound]
exten => s,1,Set(CHANNEL(hangup_handler_push)=callcenter-ended,s,1)
 same => n,UserEvent(CallCenter,call: ${CALLCENTER_CALL},step: AgentAnswered)
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${CALLCENTER_TRUNK})}" = ""]?linedown)
 same => n,Dial(PJSIP/${CALLCENTER_TARGET}@${CALLCENTER_TRUNK},60,U(callcenter-customer-answered^s^1^${CALLCENTER_CALL}))
 same => n,Hangup()
 same => n(linedown),Set(DIALSTATUS=LINEDOWN)
 same => n,Hangup()

[callcenter-customer-answered]
exten => s,1,UserEvent(CallCenter,call: ${ARG1},step: CustomerAnswered)
 same => n,Return()

[callcenter-ended]
exten => s,1,UserEvent(CallCenter,call: ${CALLCENTER_CALL},step: Ended,dialstatus: ${DIALSTATUS},cause: ${HANGUPCAUSE},answeredtime: ${ANSWEREDTIME})
 same => n,Return()
