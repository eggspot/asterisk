[general]
static = yes
writeprotect = yes

[callcenter-agents]
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)
exten => i,1,Hangup(21)

[callcenter-from-gateway]
exten => _[a-zA-Z0-9+]!,1,Goto(callcenter-inbound,s,1)
exten => i,1,Hangup(21)

[callcenter-inbound]
exten => s,1,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=4)
 same => n,Set(CURLOPT(httpheader)=X-CallCenter-Token: ${ROUTE_TOKEN})
 same => n,Set(CALLCENTER_TOKEN_SET=yes)
 same => n,Set(ROUTE=${CURL(${ROUTE_URL},trunk=${URIENCODE(${CHANNEL(endpoint)})}&caller=${URIENCODE(${CALLERID(num)})}&channel=${URIENCODE(${CHANNEL(uniqueid)})})})
 same => n,GotoIf($["${CUT(ROUTE,|,1)}" = "ring"]?ring)
 same => n,Ringing()
 same => n,Wait(20)
 same => n,Hangup(19)
 same => n(ring),Set(CALLCENTER_CALL=${CUT(ROUTE,|,2)})
 same => n,Set(CHANNEL(hangup_handler_push)=callcenter-ended,s,1(Customer))
 same => n,Set(CALLERID(all)="${CUT(ROUTE,|,5)}" <callcenter>)
 same => n,Dial(PJSIP/${CUT(ROUTE,|,3)},30,b(callcenter-inbound-agent-leg^s^1(${CUT(ROUTE,|,4)}^${CALLCENTER_CALL}))U(callcenter-agent-answered^${CALLCENTER_CALL}))
 same => n,Hangup(19)

[callcenter-inbound-agent-leg]
exten => s,1,Set(PJSIP_HEADER(add,X-CallCenter-Call)=${ARG1})
 same => n,Set(PJSIP_HEADER(add,X-CallCenter-Direction)=inbound)
 same => n,Set(CHANNEL(hangup_handler_push)=callcenter-quality,s,1(${ARG2},Agent))
 same => n,Return()

[callcenter-agent-answered]
exten => s,1,Gosub(callcenter-event,s,1(call=${ARG1}&step=AgentAnswered&channel=${URIENCODE(${UNIQUEID})}))
 same => n,Return()

[callcenter-outbound]
exten => s,1,Set(CHANNEL(hangup_handler_push)=callcenter-ended,s,1(Agent))
 same => n,Gosub(callcenter-event,s,1(call=${CALLCENTER_CALL}&step=AgentAnswered&channel=${URIENCODE(${UNIQUEID})}))
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${CALLCENTER_TRUNK})}" = ""]?linedown)
 same => n,Dial(PJSIP/${CALLCENTER_TARGET}@${CALLCENTER_TRUNK},60,b(callcenter-outbound-customer-leg^s^1(${CALLCENTER_CALL}))U(callcenter-customer-answered^${CALLCENTER_CALL}))
 same => n,Hangup()
 same => n(linedown),Set(DIALSTATUS=LINEDOWN)
 same => n,Hangup()

[callcenter-outbound-customer-leg]
exten => s,1,Set(CHANNEL(hangup_handler_push)=callcenter-quality,s,1(${ARG1},Customer))
 same => n,Return()

[callcenter-customer-answered]
exten => s,1,Gosub(callcenter-event,s,1(call=${ARG1}&step=CustomerAnswered&channel=${URIENCODE(${UNIQUEID})}))
 same => n,Return()

[callcenter-ended]
exten => s,1,Gosub(callcenter-event,s,1(call=${CALLCENTER_CALL}&step=Ended&channel=${URIENCODE(${UNIQUEID})}&dialstatus=${URIENCODE(${DIALSTATUS})}&cause=${HANGUPCAUSE}&answeredtime=${ANSWEREDTIME}))
 same => n,Gosub(callcenter-quality,s,1(${CALLCENTER_CALL},${ARG1}))
 same => n,Return()

[callcenter-quality]
exten => s,1,GotoIf($["${CHANNEL(state)}" != "Up"]?done)
 same => n,Set(LOCAL(rtcp)=receivedPackets=${CHANNEL(rtcp,rxcount)}&sentPackets=${CHANNEL(rtcp,txcount)}&receivedLost=${CHANNEL(rtcp,rxploss)}&sentLost=${CHANNEL(rtcp,txploss)})
 same => n,Set(LOCAL(rtcp)=${rtcp}&receivedJitterSeconds=${CHANNEL(rtcp,rxjitter)}&sentJitterSeconds=${CHANNEL(rtcp,txjitter)}&roundTripSeconds=${CHANNEL(rtcp,rtt)})
 same => n,Set(LOCAL(rtcp)=${rtcp}&receivedMes=${CHANNEL(rtcp,rxmes)}&sentMes=${CHANNEL(rtcp,txmes)})
 same => n,Gosub(callcenter-event,s,1(call=${ARG1}&step=Quality&leg=${ARG2}&channel=${URIENCODE(${UNIQUEID})}&${rtcp}))
 same => n(done),Return()

[callcenter-event]
exten => s,1,GotoIf($["${EVENTS_URL}" = ""]?done)
 same => n,GotoIf($["${CALLCENTER_TOKEN_SET}" = "yes"]?post)
 same => n,Set(CURLOPT(httpheader)=X-CallCenter-Token: ${ROUTE_TOKEN})
 same => n,Set(CALLCENTER_TOKEN_SET=yes)
 same => n(post),Set(CURLOPT(conntimeout)=1)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,NoOp(${CURL(${EVENTS_URL},${ARG1})})
 same => n(done),Return()
