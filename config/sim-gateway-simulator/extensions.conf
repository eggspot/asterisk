[general]
static = yes
writeprotect = yes

[simulated-customer]
exten => 0900000002,1,Busy(5)

exten => 0900000003,1,Ringing()
 same => n,Wait(90)
 same => n,Hangup(19)

exten => 0900000004,1,Hangup(20)

exten => 0900000005,1,Ringing()
 same => n,Wait(2)
 same => n,Answer()
 same => n,Wait(10)
 same => n,Hangup()

exten => 0900000006,1,Hangup(1)

exten => 0900000007,1,Hangup(34)

exten => 0900000009,1,GotoIf($["${PJSIP_DIAL_CONTACTS(phone)}" = ""]?simulated-customer-answers,s,1)
 same => n,Dial(${PJSIP_DIAL_CONTACTS(phone)},60)
 same => n,Hangup()

exten => _X.,1,Goto(simulated-customer-answers,s,1)
exten => _+X.,1,Goto(simulated-customer-answers,s,1)

[simulated-customer-answers]
exten => s,1,Ringing()
 same => n,Wait(3)
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=3600)
 same => n,Echo()

[from-phone]
exten => _X.,1,Set(CALLERID(all)="Customer" <${EXTEN}>)
 same => n,Dial(PJSIP/${EXTEN}@server,60)
 same => n,Hangup()
